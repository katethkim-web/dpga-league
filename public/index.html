<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>D-PGA 스크린대회 경기현황</title>
<meta name="description" content="D리그·P리그 경기 달력, 결과, 순위표">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column (phone first) — header, standings, calendar, match list, notice copy. */
:root{
  --bg:#f3f5f0; --surface:#ffffff; --line:#dfe4da; --fg:#18211a; --muted:#5f6b61;
  --turf:#1f6b3a; --turf-soft:#e2efe5;
  --d:#2456a6; --d-soft:#e3ebf8; --p:#c0531b; --p-soft:#fae9de;
  --win:#1f7a40; --draw:#6b6f78; --loss:#b23a3a; --today:#f2c230;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1a211c; --line:#2c362f; --fg:#e8eee9; --muted:#9aa79d;
  --turf:#5fbf7f; --turf-soft:#1f3326;
  --d:#7fa6ea; --d-soft:#1c2840; --p:#f0915c; --p-soft:#3a2418;
  --win:#5fcf86; --draw:#a3a8b2; --loss:#ef7d7d; --today:#e0b030; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1a211c; --line:#2c362f; --fg:#e8eee9; --muted:#9aa79d;
  --turf:#5fbf7f; --turf-soft:#1f3326;
  --d:#7fa6ea; --d-soft:#1c2840; --p:#f0915c; --p-soft:#3a2418;
  --win:#5fcf86; --draw:#a3a8b2; --loss:#ef7d7d; --today:#e0b030; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;line-height:1.15}
h2{font-size:21px}
.sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.head{display:flex;flex-direction:column;gap:12px}
.mode{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--turf-soft);color:var(--turf);font-weight:500;align-self:flex-start}
.mode.ro{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
section{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;letter-spacing:.04em}
.tag.D{background:var(--d-soft);color:var(--d)} .tag.P{background:var(--p-soft);color:var(--p)}

/* standings */
.tables{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.tables{grid-template-columns:1fr}}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.tbl-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700}
.tbl-h.D{color:var(--d)} .tbl-h.P{color:var(--p)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11.5px;color:var(--muted);font-weight:500;padding:6px 4px;text-align:center}
td{padding:9px 4px;text-align:center;border-top:1px solid var(--line);font-size:14px}
td.rk{font-family:var(--f-display);font-size:18px;width:38px}
tr.top td.rk{color:var(--turf)}
td.tm{text-align:left;padding-left:6px}
td.tm b{display:block;font-size:15px}
td.tm small{color:var(--muted);font-size:11.5px;display:block;line-height:1.35}
td.pt{font-weight:700;font-size:16px;width:44px}
td.w{color:var(--win)} td.l{color:var(--loss)} td.dr{color:var(--draw)}

/* calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal-top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.cal-top strong{font-family:var(--f-display);font-weight:400;font-size:20px}
.navb{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;width:38px;height:34px;font-size:16px;cursor:pointer}
.navb:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{font-size:11.5px;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.dow.sun{color:var(--loss)} .dow.sat{color:var(--d)}
.day{min-height:74px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:3px;min-width:0}
.day:nth-child(7n+7){border-right:none}
.day.out{background:var(--bg);opacity:.55}
.day .n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:2px}
.day.today .n{background:var(--today);color:#1d1a0b;border-radius:999px;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0;font-weight:700}
.chip{display:block;width:100%;text-align:left;border:none;border-radius:5px;padding:3px 4px;font:inherit;font-size:11px;line-height:1.25;cursor:pointer;letter-spacing:-.02em;word-break:keep-all}
.chip .nm{white-space:nowrap}
.chip.D{background:var(--d-soft);color:var(--fg);box-shadow:inset 2px 0 0 var(--d)}
.chip.P{background:var(--p-soft);color:var(--fg);box-shadow:inset 2px 0 0 var(--p)}
.chip .t{display:block;color:var(--muted);font-size:10px}
.chip .wn{font-weight:700;color:var(--win)}
.chip .ls{color:var(--muted);text-decoration:line-through}
.chip .dw{font-weight:700;color:var(--draw)}
.chip:focus-visible,.row:focus-visible,button:focus-visible{outline:2px solid var(--turf);outline-offset:2px}
@media (min-width:600px){.day{min-height:92px;padding:4px}.chip{font-size:12px;padding:4px 6px}}

/* match list */
.list{display:flex;flex-direction:column;gap:8px}
.dgroup{display:grid;grid-template-columns:50px minmax(0,1fr);gap:8px;align-items:start}
.date-h{display:flex;flex-direction:column;align-items:center;padding-top:6px;line-height:1.2;font-variant-numeric:tabular-nums}
.date-h b{font-size:15px}
.date-h span{font-size:12px;color:var(--muted)}
.date-h .td{background:var(--today);color:#1d1a0b;border-radius:999px;padding:0 6px;font-size:10.5px;font-weight:700;margin-top:3px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:40px auto minmax(0,1fr) auto;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.row:hover{border-color:var(--turf)}
.row .tm{font-variant-numeric:tabular-nums;font-weight:500;font-size:13px}
.row .vs{min-width:0;font-size:14px;word-break:keep-all}
.row .vs .x{color:var(--muted);font-size:11px;margin:0 4px}
.row .vs .wn{font-weight:700}
.row .vs .ls{color:var(--muted)}
.pill{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.done{background:var(--turf-soft);color:var(--win)}
.pill.draw{background:var(--line);color:var(--fg)}
.pill.wait{border:1px dashed var(--line);color:var(--muted);font-weight:500}
.pill.go{background:var(--turf);color:var(--surface)}

/* notice */
.notice{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.notice textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:13px/1.55 var(--f-body);padding:10px;resize:vertical}
.btn{border:none;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.btn.main{background:var(--turf);color:var(--surface)}
.btn.ghost{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--loss);border:1px solid var(--line);font-weight:500;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* add match */
.add{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.add label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.add select,.add input{font:inherit;font-size:15px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
.add .full{grid-column:1/-1}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.sheet .big{font-family:var(--f-display);font-size:24px;line-height:1.2}
.sheet .big .x{color:var(--muted);font-size:16px;margin:0 8px}
.choice{display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
.choice button{border:2px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:14px 6px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;line-height:1.3}
.choice button small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.choice button.on{border-color:var(--turf);background:var(--turf-soft);color:var(--turf)}
.choice .mid{padding:14px 14px}
.members{font-size:12.5px;color:var(--muted);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.empty{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
:root{color-scheme:light}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.err{margin:0;color:var(--loss);font-size:14px}
.linkb{background:none;border:none;color:var(--turf);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.pinl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.pinl input{font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;letter-spacing:.2em}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="head"><h1>D-PGA 스크린대회 경기현황</h1><p class="sub">경기 일정을 불러오는 중…</p></div></div></div>
<noscript>이 페이지는 자바스크립트가 켜져 있어야 보입니다.</noscript>
<script src="/app.js"></script>
</body>
</html>
